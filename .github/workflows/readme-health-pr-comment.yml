name: README Health PR Comment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "README*"
      - "**/README*.md"
      - "docs/**/*.md"
      - ".github/workflows/readme-health-pr-comment.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analyze PR README
        id: analyze-head
        run: node dist/cli.js README.md --format json > head-report.json

      - name: Analyze base README
        id: analyze-base
        run: |
          if git show "origin/${{ github.base_ref }}:README.md" > /tmp/base-readme.md 2>/dev/null; then
            node dist/cli.js /tmp/base-readme.md --format json > base-report.json
          else
            echo "Base README not found; skipping delta."
          fi

      - name: Run README Health (GitHub output)
        id: readme-health
        continue-on-error: true
        uses: ./
        with:
          readme-path: README.md
          fail-under: "80"

      - name: Format PR comment
        run: |
          args=(--head head-report.json --threshold 80 --readme README.md)
          if [[ -f base-report.json ]]; then
            args+=(--base base-report.json)
          fi
          node dist/postPrCommentCli.js "${args[@]}" > comment-body.md

      - name: Post sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- readme-health-pr-comment -->";
            const body = fs.readFileSync("comment-body.md", "utf8");
            const issueNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

      - name: Fail when README score is below threshold
        if: steps.readme-health.outcome == 'failure'
        run: exit 1
